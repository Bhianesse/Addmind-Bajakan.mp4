name: lve0 EPEP PY

on:
  schedule:
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'epep.py'
      - '.github/workflows/,.yml'

jobs:
  merge-and-commit:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: ✓
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ✓
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ✓
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp unidecode

      - name: ✓
        run: |
          echo "${{ secrets.EPEP_PY }}" | base64 -d > epep.py
          chmod +x epep.py

      - name: ✓
        run: |
          mkdir -p 

      - name: ✓
        run: |
          python3 epep.py

      - name: ✓
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE=","

          git config --global user.name "yanshdroid[bot]"
          git config --global user.email "yanshdroid[bot]@users.noreply.github.com"

          if [ -f "$FILE" ]; then

            git add "$FILE"

            if ! git diff --cached --quiet; then
              git commit -m "🔄 Auto update $(date +'%Y-%m-%d %H:%M:%S')"
            else
              echo "No changes to commit"
            fi

            # 👉 hanya bagian ini ditambah retry (tanpa ubah yang lain)
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin main
              git push origin main && break
              echo "Push gagal, retry ke-$i..."
              sleep 5
            done

          else
            echo ".m3u not found"
          fi
